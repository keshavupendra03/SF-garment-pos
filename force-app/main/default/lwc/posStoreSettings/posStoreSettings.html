<template>
    <div class="panel holder">
        <template lwc:if={loading}>
            <lightning-spinner alternative-text="Loading store" size="small"></lightning-spinner>
        </template>
        <h2 class="panel-title">Shop details</h2>
        <template lwc:if={error}>
            <p class="error-text">{error}</p>
        </template>

        <div class="layout">
            <div class="form">
                <div class="form-grid">
                    <lightning-input class="span-2" label="Shop name" data-field="Name" value={form.Name} required
                        maxlength="80" message-when-value-missing="Enter your shop name." onchange={handleChange}></lightning-input>
                    <lightning-input type="tel" label="Phone" data-field="Phone__c" value={form.Phone__c} maxlength="20"
                        onchange={handleChange}></lightning-input>
                    <lightning-input label="GSTIN" data-field="GSTIN__c" value={form.GSTIN__c} maxlength="15"
                        pattern="[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]" placeholder="08ABCDE1234F1Z5"
                        message-when-pattern-mismatch="GSTIN should be 15 characters, like 08ABCDE1234F1Z5."
                        onchange={handleChange}></lightning-input>
                    <lightning-textarea class="span-2" label="Address" data-field="Address__c" value={form.Address__c}
                        max-length="255" onchange={handleChange}></lightning-textarea>
                    <lightning-textarea class="span-2" label="Receipt footer" data-field="Receipt_Footer__c"
                        value={form.Receipt_Footer__c} max-length="255"
                        placeholder="Thank you! Exchange within 7 days with bill and tags."
                        onchange={handleChange}></lightning-textarea>
                </div>
            </div>

            <div class="preview-wrap" aria-label="Receipt preview">
                <div class="label">Receipt preview</div>
                <div class="paper">
                    <div class="paper-name">{preview.name}</div>
                    <div>{preview.address}</div>
                    <div>{preview.phone}</div>
                    <div>{preview.gstin}</div>
                    <div class="paper-bold">TAX INVOICE</div>
                    <div class="paper-rule"></div>
                    <div class="paper-left">Bill : {nextBillText}</div>
                    <div class="paper-left paper-muted">… items …</div>
                    <div class="paper-rule"></div>
                    <div class="paper-footer">{preview.footer}</div>
                </div>
            </div>
        </div>
    </div>

    <div class="panel">
        <h2 class="panel-title">Billing &amp; GST</h2>
        <div class="form-grid form-grid_3">
            <lightning-input label="Bill number prefix" data-field="Bill_Prefix__c" value={form.Bill_Prefix__c}
                maxlength="10" field-level-help="Printed before the bill number." onchange={handleChange}></lightning-input>
            <div class="readonly">
                <div class="readonly-label">Next bill number</div>
                <div class="name">{nextBillText}</div>
            </div>
            <lightning-input type="number" label="Loyalty points per ₹100" data-field="Points_Per_100__c"
                value={form.Points_Per_100__c} min="0" step="0.01" onchange={handleChange}></lightning-input>
            <lightning-combobox label="Shop time zone" data-field="Time_Zone__c" value={form.Time_Zone__c}
                options={timeZoneOptions} field-level-help="Bill dates and times, and the Bills tab's Today, use this time zone."
                onchange={handleChange}></lightning-combobox>
            <lightning-input type="number" label="Return window (days)" data-field="Return_Days__c"
                value={form.Return_Days__c} min="0" max="365" step="1"
                field-level-help="Returns on older bills show a warning but are still allowed."
                onchange={handleChange}></lightning-input>
            <lightning-input type="number" label="GST threshold per piece (₹)" data-field="Tax_Threshold__c"
                value={form.Tax_Threshold__c} required min="0" step="0.01" onchange={handleChange}></lightning-input>
            <lightning-input type="number" label="GST rate up to threshold (%)" data-field="Tax_Rate_Low__c"
                value={form.Tax_Rate_Low__c} required min="0" max="100" step="0.01" onchange={handleChange}></lightning-input>
            <lightning-input type="number" label="GST rate above threshold (%)" data-field="Tax_Rate_High__c"
                value={form.Tax_Rate_High__c} required min="0" max="100" step="0.01" onchange={handleChange}></lightning-input>
        </div>
        <p class="meta hint">{slabText}</p>
        <p class="meta">{pointsText}</p>
        <p class="meta">Defaults follow the garment GST slabs from September 2025 (5% up to ₹2,500, 18% above). Confirm with your accountant.</p>
    </div>

    <template lwc:if={isDirty}>
        <div class="save-bar">
            <span class="save-text">Unsaved changes</span>
            <button class="secondary-btn" onclick={handleDiscard}>Discard</button>
            <button class="primary-btn save-btn" disabled={saving} onclick={handleSave}>{saveLabel}</button>
        </div>
    </template>
</template>
